[package]
name = "sabrage-parity"
version = "0.1.0"
edition = "2021"

# The parity crate carries no runtime surface: everything it does lives in tests
# (tier-1 always-on `cargo test` checks per docs/design/design-parity.md §4).
# Hence every dependency is a dev-dependency.
[dependencies]

[dev-dependencies]
sabrage-core = { path = "../sabrage-core" }
sabrage-contract-gen = { path = "../sabrage-contract-gen" }
serde_json = "1"
toml = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
# Goldens for the wine log filename rule build their timestamps the same way
# `logs::wine_log_candidate` does (local time, `date +%Y%m%d-%H%M%S` shape).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
