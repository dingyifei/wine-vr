[package]
name = "sabrage-contract-gen"
version = "0.1.0"
edition = "2021"

# Exposed as a lib so sabrage-parity's tier-1 tests can call `generate()` directly
# (regen-vs-committed diff) without shelling out to the binary. The bin is a thin
# --write/--check shim over the lib.
[lib]
name = "sabrage_contract_gen"
path = "src/lib.rs"

[[bin]]
name = "sabrage-contract-gen"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
sha2 = "0.10"
hex = "0.4"
