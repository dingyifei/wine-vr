# wine-vr shared parity contract — the single source for pins, paths, ports, and the
# check / launch-action registries shared by demo.sh (via the GENERATED
# scripts/demo/contract.gen.sh, sourced by lib.sh) and the native Sabrage pipeline
# (sabrage-core parses this file at compile time and binds evaluators by slug).
#
# Edit THIS file, never contract.gen.sh; regenerate with: scripts/dev/parity.sh --regen
# (until the generator lands in Phase 1: hand-edit contract.gen.sh to match and update
# its # contract-sha256: header — doctor's meta.contract-sync check verifies it).
#
# Gate vocabulary (how run-preflight treats a check, per side):
#   block   — launch aborts on failure (die / Fatal)
#   warn    — failure prints a warning, launch continues
#   autofix — failure triggers an automatic permanent fix, then a re-check
#   none    — doctor-only; not part of the launch preflight on that side
# volatile = true — the tier-2 live differ compares presence only (adb/lsof/session
# state can legitimately change between the two doctor runs).

[deps]
url = "https://github.com/dingyifei/wine-vr/releases/download/deps-v1"
gbe_dll_asset = "gbe-steam_api64-regular-x64.dll"
gbe_dll_sha256 = "cc5a2c9cb93fdbde7dadb825138ab7f694e3f8c310cdd675f733eaa784cbcc3e"
dxmt_tgz_asset = "dxmt-artifacts-monofunc.tar.gz"
dxmt_tgz_sha256 = "487e57e86e9866c922f8d8e42a50cb0818697b927739b6741fae8f4447e2df96"

[game]
appid = 620980
depot = 620981
manifest = "6291266771922375922"
bs_dir_leaf = "Beat Saber 1294"

[paths]
host_xr_json = "/usr/local/share/openxr/1/active_runtime.x86_64.json"

[ports]
stream = [9943, 9944]
# 9947 is deliberately absent — the legacy client never used it (explicit list, never a range)
legacy_reverse = [9944, 9945, 9946, 9948]
dashboard_addr = "127.0.0.1:8082"

[dxmt]
# The complete artifact set install.sh deploys; presence gates key on ALL of these.
files = [
  "x86_64-windows/d3d10core.dll",
  "x86_64-windows/d3d11.dll",
  "x86_64-windows/dxgi.dll",
  "x86_64-windows/winemetal.dll",
  "x86_64-unix/winemetal.so",
]

