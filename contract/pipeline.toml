# ── launch-action registry ────────────────────────────────────────────────────
# Unconditional ordered preparation steps in run.sh (NOT check-shaped; tagged
# # launch-action: in run.sh). Order here == execution order == tag order.

[[launch_action]]
id = "adb-forward-hygiene"
what = "wired: create adb forward tcp:9943/9944 per-serial; normal: remove exactly those two per-serial (never --remove-all)"

[[launch_action]]
id = "wineserver-reset"
what = "wineserver -k + bounded -w wait (5 s, fatal on timeout)"

[[launch_action]]
id = "goldberg-stage"
what = "swap steam_api64.dll (backup .orig-steam once), write steam_appid.txt (no trailing newline), truncate-create steam_settings/ flags"

[[launch_action]]
id = "audio-route"
what = "route default output to BlackHole 2ch (remember previous), volume 100; guarded — restored on exit"

[[launch_action]]
id = "dashboard"
what = "launch alvr_dashboard in the background (polls 127.0.0.1:8082); guarded — closed on exit"

[[launch_action]]
id = "adb-reverse-cleanup"
what = "alvr: adb reverse --remove-all; legacy oxrsys: reverse tunnels for legacy_reverse ports + am start of the Android client"

[[launch_action]]
id = "launch-wine"
what = "spawn wine --bottle --no-update --cx-app with XR_RUNTIME_JSON/CX_GRAPHICS_BACKEND/WINEDEBUG/SteamAppId env, log to logs/beatsaber-<ts>.log, wait; exit = wine rc"
